name: review-collect

on:
  # GAS(Google Apps Script)가 매일 08:45 KST에 workflow_dispatch로 트리거
  # GitHub Actions cron은 불안정하여 제거 — GAS가 방아쇠 역할
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Slack 미게시 테스트 모드 (체크하면 콘솔 출력만)'
        type: boolean
        default: false
      # GAS가 Script Property의 토큰을 주입 (비우면 아래 env가 Secret으로 폴백)
      catchtable_token:
        description: '캐치테이블 토큰 (GAS 주입용, 수동 실행 시 비워두면 Secret 사용)'
        required: false
        default: ''
      naver_cookie:
        description: '네이버 쿠키 (GAS 주입용, 비우면 Secret 사용)'
        required: false
        default: ''
      google_cookie:
        description: '구글 쿠키 (F12 캡처, 비우면 Secret 사용)'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # 주입된 토큰이 이후 로그에 노출되지 않도록 마스킹
      - name: 주입 토큰 마스킹
        run: |
          [ -n "$CT" ] && echo "::add-mask::$CT" || true
          [ -n "$NV" ] && echo "::add-mask::$NV" || true
          [ -n "$GG" ] && echo "::add-mask::$GG" || true
        env:
          CT: ${{ inputs.catchtable_token }}
          NV: ${{ inputs.naver_cookie }}
          GG: ${{ inputs.google_cookie }}

      - name: KST 날짜 계산
        id: date
        run: echo "kst=$(TZ='Asia/Seoul' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # seen_reviews.db: 직전 실행 캐시 복원 후 이번 결과로 저장
      - uses: actions/cache@v4
        with:
          path: seen_reviews.db
          key: review-seen-db-${{ github.run_id }}
          restore-keys: review-seen-db-

      - name: 리뷰 수집 (실패 시 90초 간격 최대 3회 재시도)
        run: |
          for i in 1 2 3; do
            python main.py collect && break
            if [ $i -lt 3 ]; then
              echo "[$i/3] 수집 실패 — 90초 후 재시도..."
              sleep 90
            else
              echo "[3/3] 최종 실패"
              exit 1
            fi
          done
        env:
          USE_MOCK: "0"
          SLACK_DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: "#03_매장리뷰_현황"
          STORE_NAME: "주신당 강남점"
          NAVER_STORE_ID: "10037388"
          NAVER_PLACE_ID: "1916994932"
          CATCHTABLE_STORE_ID: "64686"
          NAVER_COOKIE: ${{ inputs.naver_cookie != '' && inputs.naver_cookie || secrets.NAVER_COOKIE }}
          CATCHTABLE_TOKEN: ${{ inputs.catchtable_token != '' && inputs.catchtable_token || secrets.CATCHTABLE_TOKEN }}
          # 구글 — 설정 전까지 빈 값이면 자동 스킵. F12 쿠키 방식(GOOGLE_COOKIE) 또는 공식 API(REFRESH_TOKEN)
          GOOGLE_LOCATION_ID: ""
          GOOGLE_COOKIE: ${{ inputs.google_cookie != '' && inputs.google_cookie || secrets.GOOGLE_COOKIE }}
          GOOGLE_ACCOUNT_ID: ${{ secrets.GOOGLE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      # pending_reviews.json: post 워크플로우와 날짜 키로 공유
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pending_reviews.json
          key: review-pending-${{ steps.date.outputs.kst }}

      - name: 장애 알림
        if: failure()
        run: python alert.py "🚨 *review-collect 실패* — GitHub Actions 로그 확인 필요"
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: "#03_매장리뷰_현황"
