name: review-status

on:
  # 슬랙 리뷰 채널에서 "현황" 입력 시 GAS가 workflow_dispatch로 호출
  workflow_dispatch:
    inputs:
      # GAS가 Script Property의 토큰을 주입 (비우면 아래 env가 Secret으로 폴백)
      catchtable_token:
        description: '캐치테이블 토큰 (GAS 주입용, 비우면 Secret 사용)'
        required: false
        default: ''
      naver_cookie:
        description: '네이버 쿠키 (GAS 주입용, 비우면 Secret 사용)'
        required: false
        default: ''

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # 주입된 토큰이 이후 로그에 노출되지 않도록 마스킹
      - name: 주입 토큰 마스킹
        run: |
          [ -n "$CT" ] && echo "::add-mask::$CT" || true
          [ -n "$NV" ] && echo "::add-mask::$NV" || true
        env:
          CT: ${{ inputs.catchtable_token }}
          NV: ${{ inputs.naver_cookie }}

      # 주간/월간 증가량 계산용 totals 히스토리(seen_reviews.db) 복원 — 조회 전용
      - uses: actions/cache/restore@v4
        with:
          path: seen_reviews.db
          key: review-seen-db-${{ github.run_id }}
          restore-keys: review-seen-db-

      - name: 오늘 리뷰 현황 집계 + Slack 게시
        run: python status.py
        env:
          USE_MOCK: "0"
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: "#03_매장리뷰_현황"
          NAVER_PLACE_ID: "1916994932"
          CATCHTABLE_STORE_ID: "64686"
          NAVER_COOKIE: ${{ inputs.naver_cookie != '' && inputs.naver_cookie || secrets.NAVER_COOKIE }}
          CATCHTABLE_TOKEN: ${{ inputs.catchtable_token != '' && inputs.catchtable_token || secrets.CATCHTABLE_TOKEN }}

      - name: 장애 알림
        if: failure()
        run: python alert.py "🚨 *review-status 실패* — GitHub Actions 로그 확인 필요"
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: "#03_매장리뷰_현황"
