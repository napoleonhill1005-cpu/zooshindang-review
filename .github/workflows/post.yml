name: review-post

on:
  # collect 완료 즉시 자동 실행 (cron 드랍 방지)
  workflow_run:
    workflows: ["review-collect"]
    types: [completed]
  # 수동 실행 또는 collect 실패 시 백업용 cron
  schedule:
    - cron: "20 0 * * *"  # 매일 09:20 KST — 백업 (collect가 이미 post 트리거)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Slack 미게시 테스트 모드 (체크하면 콘솔 출력만)'
        type: boolean
        default: false

jobs:
  post:
    # workflow_run으로 트리거됐을 때는 collect 성공한 경우만 실행
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: KST 날짜 계산
        id: date
        run: echo "kst=$(TZ='Asia/Seoul' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # collect 워크플로우가 저장한 pending 캐시 복원 (같은 날짜 키)
      - uses: actions/cache/restore@v4
        with:
          path: pending_reviews.json
          key: review-pending-${{ steps.date.outputs.kst }}
          restore-keys: review-pending-

      - name: Slack 게시
        run: python main.py post
        env:
          SLACK_DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: "#03_매장리뷰_현황"
          STORE_NAME: "주신당 강남점"

      - name: 장애 알림
        if: failure()
        run: python alert.py "🚨 *review-post 실패* — GitHub Actions 로그 확인 필요"
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: "#03_매장리뷰_현황"
