name: schedule-board

on:
  # 슬랙에서 직원이 "근무"/"스케줄"(또는 이름/요일) 입력 시
  # GAS(Google Apps Script)가 workflow_dispatch로 호출.
  #   - query 비움 → 오늘(영업일 기준) 근무표
  #   - query="오시환" → 해당 직원 주간 근무
  #   - query="금"     → 해당 요일 근무표
  workflow_dispatch:
    inputs:
      query:
        description: '직원이 입력한 텍스트 (이름/요일/빈값=오늘)'
        type: string
        required: false
        default: ''

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 근무표 시트 읽기 + Slack 게시
        run: python schedule_board.py "${{ inputs.query }}"
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: "#03_매장리뷰_현황"
          # 근무표 전용 채널이 있으면 GitHub Secret/Variable로 분리 가능
          SCHEDULE_SLACK_CHANNEL: ${{ vars.SCHEDULE_SLACK_CHANNEL }}
          # 시트 ID는 코드 기본값 사용. 변경 시 아래 주석 해제
          # SCHEDULE_SHEET_ID: ${{ vars.SCHEDULE_SHEET_ID }}

      - name: 장애 알림
        if: failure()
        run: python alert.py "🚨 *schedule-board 실패* — GitHub Actions 로그 확인 필요"
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: "#03_매장리뷰_현황"
