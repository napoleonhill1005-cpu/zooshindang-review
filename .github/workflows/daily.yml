name: daily-review-digest

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch: {}    # 수동 실행 버튼

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # 중복제거 DB를 실행 간에 보존 (GitHub Actions는 디스크가 매번 초기화되므로 캐시 사용)
      - uses: actions/cache@v4
        with:
          path: seen_reviews.db
          key: seen-reviews-db-${{ github.run_id }}
          restore-keys: seen-reviews-db-

      - run: python main.py
        env:
          USE_MOCK: "0"
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: "#03_매장리뷰_현황"
          STORE_NAME: "주신당 강남점"
          NAVER_STORE_ID: "10037388"
          NAVER_PLACE_ID: "1916994932"
          CATCHTABLE_STORE_ID: "64686"
          NAVER_COOKIE: ${{ secrets.NAVER_COOKIE }}
          CATCHTABLE_TOKEN: ${{ secrets.CATCHTABLE_TOKEN }}
